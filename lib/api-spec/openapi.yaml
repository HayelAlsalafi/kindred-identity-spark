openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: CCNA Learning SaaS API foundation
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Learner-facing read operations
  - name: auth
    description: Clerk-backed authentication state
  - name: admin
    description: Server-side administrator boundary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /topics:
    get:
      operationId: listTopics
      tags: [learning]
      summary: List active CCNA topics
      description: Returns the active topic catalog with foundation-level progress fields.
      responses:
        "200":
          description: Topic summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicSummary"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [learning]
      summary: Get the learning dashboard summary
      description: Returns aggregate learning metrics for the current foundation experience.
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current application user
      description: Returns the local user bridge for the authenticated Clerk session.
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Check the server-side administrator boundary
      description: This foundation endpoint proves that ADMIN authorization is enforced by the server.
      security:
        - clerkSession: []
      responses:
        "200":
          description: Administrator access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated user is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /questions/{id}:
    get:
      operationId: getQuestion
      tags: [questions]
      summary: Get an active question for learners
      description: Returns an ACTIVE question in an ACTIVE topic. Disabled questions return 404. Correct answers are never included.
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Learner question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerQuestion"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Question not found or not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/topics:
    get:
      operationId: adminListTopics
      tags: [admin]
      summary: List all topics including disabled (ADMIN)
      security:
        - clerkSession: []
      responses:
        "200":
          description: All topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTopic"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: adminCreateTopic
      tags: [admin]
      summary: Create a topic (ADMIN)
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTopicCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTopic"
        "400":
          description: Invalid topic data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/topics/{id}:
    patch:
      operationId: adminUpdateTopic
      tags: [admin]
      summary: Update a topic (ADMIN)
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTopicUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTopic"
        "400":
          description: Invalid topic data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/topics/{id}/disable:
    post:
      operationId: adminDisableTopic
      tags: [admin]
      summary: Disable a topic (kept in database) (ADMIN)
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTopic"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/questions:
    get:
      operationId: adminListQuestions
      tags: [admin]
      summary: List questions with pagination and filters (ADMIN)
      security:
        - clerkSession: []
      parameters:
        - name: topicId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, DISABLED]
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [EASY, MEDIUM, HARD]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: Paginated questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestionListResponse"
        "400":
          description: Invalid filter or pagination value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: adminCreateQuestion
      tags: [admin]
      summary: Create a single-correct multiple-choice question (ADMIN)
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminQuestionCreate"
      responses:
        "201":
          description: Created with a database-generated immutable question code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "400":
          description: Invalid question or topic data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/questions/{id}:
    patch:
      operationId: adminUpdateQuestion
      tags: [admin]
      summary: Update a question and optionally replace its options (ADMIN)
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminQuestionUpdate"
      responses:
        "200":
          description: Updated; question code is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "400":
          description: Invalid question or topic data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Question not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/questions/{id}/disable:
    post:
      operationId: adminDisableQuestion
      tags: [admin]
      summary: Disable a question without deleting it (ADMIN)
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Disabled question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Question not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk's same-origin session cookie; login and logout are managed by Clerk UI.
  schemas:
    AdminTopic:
      type: object
      required: [id, slug, name, description, displayOrder, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 2000
        displayOrder:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminTopicCreate:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 2000
        displayOrder:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    AdminTopicUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 2000
        displayOrder:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    AdminQuestionOption:
      type: object
      additionalProperties: false
      required: [optionKey, displayOrder, text, isCorrect]
      properties:
        optionKey:
          type: string
          minLength: 1
          maxLength: 8
        displayOrder:
          type: integer
          minimum: 0
        text:
          type: string
          minLength: 1
          maxLength: 4000
        isCorrect:
          type: boolean
    AdminQuestion:
      type: object
      additionalProperties: false
      required: [id, questionCode, topicId, text, type, difficulty, explanation, imageKey, referenceNotes, status, createdAt, updatedAt, options]
      properties:
        id:
          type: string
          format: uuid
        questionCode:
          type: string
          pattern: "^CCNA-Q-[0-9]{6,}$"
          readOnly: true
        topicId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 10000
        type:
          type: string
          enum: [MULTIPLE_CHOICE_SINGLE]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        explanation:
          type: string
          maxLength: 10000
        imageKey:
          type: string
          maxLength: 512
          nullable: true
        referenceNotes:
          type: string
          maxLength: 10000
          nullable: true
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        options:
          type: array
          items:
            $ref: "#/components/schemas/AdminQuestionOption"
    AdminQuestionListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminQuestion"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    AdminQuestionCreate:
      type: object
      additionalProperties: false
      required: [topicId, text, type, difficulty, options]
      properties:
        topicId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 10000
        type:
          type: string
          enum: [MULTIPLE_CHOICE_SINGLE]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        explanation:
          type: string
          maxLength: 10000
        imageKey:
          type: string
          maxLength: 512
          nullable: true
        referenceNotes:
          type: string
          maxLength: 10000
          nullable: true
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [optionKey, text, isCorrect]
            properties:
              optionKey:
                type: string
                minLength: 1
                maxLength: 8
              text:
                type: string
                minLength: 1
                maxLength: 4000
              isCorrect:
                type: boolean
    AdminQuestionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        topicId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 10000
        type:
          type: string
          enum: [MULTIPLE_CHOICE_SINGLE]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        explanation:
          type: string
          maxLength: 10000
        imageKey:
          type: string
          maxLength: 512
          nullable: true
        referenceNotes:
          type: string
          maxLength: 10000
          nullable: true
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: When supplied, replaces the whole option list and must contain exactly one correct option.
          items:
            type: object
            additionalProperties: false
            required: [optionKey, text, isCorrect]
            properties:
              optionKey:
                type: string
                minLength: 1
                maxLength: 8
              text:
                type: string
                minLength: 1
                maxLength: 4000
              isCorrect:
                type: boolean
    LearnerQuestion:
      type: object
      required: [id, questionCode, topicId, text, type, difficulty, imageKey, options]
      properties:
        id:
          type: string
          format: uuid
        questionCode:
          type: string
        topicId:
          type: string
          format: uuid
        text:
          type: string
        type:
          type: string
          enum: [MULTIPLE_CHOICE_SINGLE]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        imageKey:
          type: string
          nullable: true
        options:
          type: array
          items:
            type: object
            required: [optionKey, text]
            properties:
              optionKey:
                type: string
              text:
                type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TopicSummary:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - questionCount
        - attemptedCount
        - correctCount
        - accuracy
        - averageDurationSeconds
        - progressPercent
        - displayOrder
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        questionCount:
          type: integer
          minimum: 0
        attemptedCount:
          type: integer
          minimum: 0
        correctCount:
          type: integer
          minimum: 0
        accuracy:
          type: number
          minimum: 0
          maximum: 100
        averageDurationSeconds:
          type: integer
          minimum: 0
        progressPercent:
          type: number
          minimum: 0
          maximum: 100
        displayOrder:
          type: integer
    DashboardSummary:
      type: object
      required:
        - totalTopics
        - totalQuestions
        - questionsAttempted
        - overallAccuracy
        - studyMinutes
        - streakDays
        - focusTopic
      properties:
        totalTopics:
          type: integer
          minimum: 0
        totalQuestions:
          type: integer
          minimum: 0
        questionsAttempted:
          type: integer
          minimum: 0
        overallAccuracy:
          type: number
          minimum: 0
          maximum: 100
        studyMinutes:
          type: integer
          minimum: 0
        streakDays:
          type: integer
          minimum: 0
        focusTopic:
          oneOf:
            - $ref: "#/components/schemas/TopicSummary"
            - type: "null"
    CurrentUser:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - status
        - createdAt
        - updatedAt
        - lastLoginAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    CurrentUserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
    AdminAccessResponse:
      type: object
      required:
        - allowed
        - role
      properties:
        allowed:
          type: boolean
          enum: [true]
        role:
          type: string
          enum: [ADMIN]
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string

